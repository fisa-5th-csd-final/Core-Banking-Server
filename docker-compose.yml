services:
  mysql:
    image: mysql:8.4
    container_name: core-bank-mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    env_file:
      - .env
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 6

  flyway:
    image: flyway/flyway:10
    container_name: core-bank-flyway
    volumes:
      - ./bank/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      FLYWAY_URL: ${DATABASE_URL}
      FLYWAY_USER: ${DATABASE_USERNAME}
      FLYWAY_PASSWORD: ${DATABASE_PASSWORD}
    command:
      - -locations=filesystem:/flyway/sql
      - migrate
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  core-bank-server:
    container_name: core-bank-server
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8080:8080"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mysql:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

volumes:
  mysql-data:
