spring:
  config:
    activate:
      on-profile: db

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO}
    generate-ddl: true
    open-in-view: false # osiv
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect # ??