spring:
  application:
    name: bank
  config:
    import:
      - classpath:application-auth.yml
      - classpath:application-db.yml
      - classpath:application-open-api.yml
      - classpath:application-bank.yml
      - classpath:application-cdc.yml
  profiles:
    active: ${PROFILE}

backend:
  endpoint: ${BACKEND_ENDPOINT}

server:
  servlet:
    session:
      cookie:
        name: BANKSESSION
