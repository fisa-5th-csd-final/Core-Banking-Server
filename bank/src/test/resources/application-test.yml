# src/test/resources/application-test.yml
spring:
  datasource:
    url: ${TEST_DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  access-token:
    expiry: 30m
  refresh-token:
    expiry: 7d
